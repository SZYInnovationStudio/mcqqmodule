<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
<title>模块中心 · MC × QQ</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/modules.css"><script type="module" src="/modules.js"></script>
</head><body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
<div class="page-intro module-intro"><div><h1>模块中心</h1><p id="host-badge">通用模块平台</p></div><a class="secondary link-button" href="/MODULE-SPEC.md" target="_blank" rel="noopener">开发规范</a></div>
<section class="module-overview" aria-label="模块概况"><div><small>已安装</small><strong id="module-count">—</strong></div><div><small>运行中</small><strong id="enabled-count">—</strong></div><div><small>宿主版本</small><strong id="host-version">—</strong></div></section>
<div class="module-layout">
  <section class="panel module-catalog"><div class="panel-head"><div><h2>已安装模块</h2></div><button id="refresh-modules" class="ghost" type="button">刷新</button></div><div id="module-list" class="module-list empty">正在读取…</div><div id="module-errors" class="module-errors" hidden></div></section>
  <aside class="module-side">
    <section class="panel module-installer"><div class="panel-head"><div><h2>安装或升级</h2></div></div><p>新模块推荐使用 <code>.mcqqmodule</code>。原有 <code>.szydmodule</code> 仍可直接安装和升级。</p><label class="module-file"><span>选择模块包</span><input id="module-file" type="file" accept=".mcqqmodule,.szydmodule,.json,application/json"></label><pre id="module-preview" class="module-preview result">尚未选择文件。</pre><button id="install-module" class="primary install-button" type="button" disabled>安装 / 升级</button><p id="module-message" class="message" role="status"></p></section>
    <section class="panel permission-panel"><h2>模块权限</h2><p>服务端模块可访问 RCON、连接配置、QQ 登记、AQQBot、日志和群通知。</p><div class="module-warning"><strong>管理员信任边界</strong><span>服务端模块拥有完整运行权限。只安装来源明确、已经审核的模块包。</span></div></section>
  </aside>
</div>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
