<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
<title>模块中心 · MC × QQ</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/modules.css"><script type="module" src="/modules.js"></script>
</head><body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
      <header class="page-intro module-intro">
        <div>
          <h1>模块中心</h1>
          <p id="host-badge">宿主版本 <span id="host-version">—</span></p>
        </div>
        <a class="primary link-button module-install-jump" href="#module-installer">安装模块</a>
      </header>

      <div class="module-layout">
        <section class="panel module-catalog" aria-labelledby="module-catalog-title">
          <header class="module-catalog-head">
            <div>
              <h2 id="module-catalog-title">已安装模块</h2>
              <p class="module-counts"><strong id="module-count">—</strong> 个模块<span aria-hidden="true"> · </span><strong id="enabled-count">—</strong> 个已启用</p>
            </div>
            <button id="refresh-modules" class="ghost" type="button" aria-label="刷新模块列表">刷新</button>
          </header>
          <div id="module-list" class="module-list" aria-busy="true">
            <p class="module-empty">正在读取模块…</p>
          </div>
          <p id="module-catalog-message" class="message" role="status"></p>
          <div id="module-errors" class="module-errors" hidden></div>
        </section>

        <section id="module-installer" class="panel module-installer" aria-labelledby="module-installer-title" tabindex="-1">
          <header class="module-installer-head">
            <h2 id="module-installer-title">安装或升级</h2>
            <a class="text-link" href="/MODULE-SPEC.md" target="_blank" rel="noopener">开发规范<span aria-hidden="true"> ↗</span></a>
          </header>
          <p id="module-file-formats" class="module-file-formats"><code>.mcqqmodule</code> 或 <code>.szydmodule</code>，<span>最大 48 MiB</span></p>

          <div class="module-file-picker">
            <input class="module-file-input" id="module-file" type="file" accept=".mcqqmodule,.szydmodule,.json,application/json" aria-label="选择模块包" aria-describedby="module-file-formats">
            <label for="module-file" class="module-file-label">
              <span class="secondary module-file-button">选择文件</span>
              <span id="module-file-name" class="module-file-name" aria-live="polite">尚未选择文件</span>
            </label>
          </div>

          <section id="module-preview-panel" class="module-preview-panel" aria-labelledby="module-preview-title" hidden>
            <h3 id="module-preview-title">安装预览</h3>
            <dl id="module-preview" class="module-facts"></dl>
          </section>
          <div class="module-installer-actions">
            <button id="install-module" class="primary" type="button" disabled>安装或升级</button>
            <p id="module-message" class="message" role="status"></p>
          </div>

          <details class="module-trust">
            <summary>服务端模块拥有完整宿主权限</summary>
            <p>模块可访问 RCON、连接配置、QQ 登记和日志等数据。请安装来源明确、经过审核的包。</p>
          </details>
        </section>
      </div>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
