<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
  <title>AQQBot 查询 · MC × QQ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/users.css"><script type="module" src="/users.js"></script>
</head>
<body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
  <div class="page-intro"><div><h1>AQQBot 绑定查询</h1><p>输入 QQ 号或 Minecraft 玩家名，直接读取服务器 AQQBot 的当前结果。管理操作请到独立的“绑定管理”页面。</p></div></div>
  <section class="panel">
    <form id="query-form" class="query-form">
      <label for="query-type">查询方式</label>
      <select id="query-type" name="type"><option value="qq">QQ 号</option><option value="player">玩家名</option></select>
      <label for="query-value" id="query-label">QQ 号</label>
      <input id="query-value" name="value" inputmode="numeric" autocomplete="off" required placeholder="输入 QQ 号">
      <button type="submit" class="primary">查询 AQQBot</button>
    </form>
    <p id="query-message" class="message" role="status"></p>
    <div id="query-result" class="query-result" hidden>
      <h2>服务器查询结果</h2>
      <p id="result-qq"></p>
      <p id="result-players"></p>
    </div>
    <p class="query-note">本页只查询，不修改 AQQBot 绑定。</p>
  </section>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
