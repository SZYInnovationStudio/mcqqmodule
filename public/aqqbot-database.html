<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
  <title>AQQBot 整库 · MC × QQ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/aqqbot-database.css"><script type="module" src="/aqqbot-database.js"></script>
</head>
<body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
  <div class="page-intro"><div><h1>AQQBot 整库</h1><p>显示 MC 插件从 AQQBot data.yml 读取的完整绑定快照。此页只有查询和刷新，没有修改功能。</p></div><button id="refresh-database" class="secondary" type="button">刷新</button></div>
  <section class="panel">
    <div class="database-toolbar"><label>筛选 QQ、OpenID 或玩家名<input id="database-search" type="search" autocomplete="off" placeholder="输入任意关键字"></label><div><strong id="database-count">0 条</strong><small id="database-time">等待同步</small></div></div>
    <p id="database-message" class="message" role="status"></p>
    <div class="database-scroll table-frame" role="region" aria-label="AQQBot 整库" tabindex="0"><table class="database-table data-table responsive-table" role="table"><thead><tr><th>QQ 号</th><th>登记 OpenID</th><th>Minecraft 玩家</th><th>玩家数</th></tr></thead><tbody id="database-rows"></tbody></table></div>
  </section>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
