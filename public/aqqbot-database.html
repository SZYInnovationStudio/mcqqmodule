<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2c">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/aqqbot-database.css"><script type="module" src="/aqqbot-database.js"></script>
</head>
<body><main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">M<span>×</span>Q</span><div><strong>MC × QQ</strong><small>服务器桥接管理</small></div></div><nav class="nav" aria-label="主导航"><a href="/">总览</a><a href="/settings">修改信息</a><a href="/templates">消息模板</a><a href="/terminal">RCON 终端</a><a href="/player-logs">玩家日志</a><a href="/server-logs">服务器日志</a><a href="/users">AQQBot 查询</a><a href="/binding-admin">绑定管理</a><a class="active" aria-current="page" href="/aqqbot-database">AQQBot 整库</a><a href="/registrations">QQ 登记</a><a href="/modules">增量模块</a><a href="/guide">使用教程</a></nav><div class="top-actions"><span id="current-user" class="local-tag"></span><button id="logout" class="ghost">退出</button></div></header>
  <div class="page-intro"><div><div class="eyebrow">8.7.0 · 只读快照</div><h1>AQQBot 整库</h1><p>显示 MC 插件从 AQQBot data.yml 读取的完整绑定快照。此页只有查询和刷新，没有修改功能。</p></div><button id="refresh-database" class="secondary" type="button">刷新</button></div>
  <section class="panel">
    <div class="database-toolbar"><label>筛选 QQ、OpenID 或玩家名<input id="database-search" type="search" autocomplete="off" placeholder="输入任意关键字"></label><div><strong id="database-count">0 条</strong><small id="database-time">等待同步</small></div></div>
    <p id="database-message" class="message" role="status"></p>
    <div class="database-scroll"><table class="database-table"><thead><tr><th>QQ 号</th><th>登记 OpenID</th><th>Minecraft 玩家</th><th>玩家数</th></tr></thead><tbody id="database-rows"></tbody></table></div>
  </section>
</main></body></html>
