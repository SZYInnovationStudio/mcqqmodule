<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
  <title>玩家命令日志 · MC × QQ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/player-logs.css"><script type="module" src="/player-logs.js"></script>
</head>
<body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
  <div class="page-intro"><div><h1>玩家命令日志</h1><p>查看 QQ 玩家命令的处理记录，与管理员 RCON 执行日志分开。</p></div><button id="refresh" class="secondary" type="button">刷新日志</button></div>
  <section class="panel"><div class="log-controls"><label>命令分类<select id="category"><option value="">全部分类</option><option value="QQ 登记">QQ 登记</option><option value="MC 绑定">MC 绑定</option><option value="MC 解绑">MC 解绑</option><option value="服务器查询">服务器查询</option></select></label><label>处理状态<select id="status"><option value="">全部状态</option><option value="已回复">已回复</option><option value="未登记拦截">未登记拦截</option><option value="失败">失败</option></select></label><label>查找 QQ 号 / OpenID<input id="search" type="search" placeholder="输入 QQ 号或 OpenID" autocomplete="off"></label></div><p class="hint">仅记录允许群中被机器人识别并处理的命令；无关聊天、重复消息和频率限制丢弃的消息不记录。确认码在日志里会遮盖。最近保留 200 条，加密保存在本机。</p><p id="log-message" class="message" role="status"></p><div class="log-summary" id="log-summary"></div><div id="log-list" class="log-list" aria-live="polite">正在加载…</div></section>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
