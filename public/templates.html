<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
<title>消息模板 · MC × QQ</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/templates.css"><script type="module" src="/templates.js"></script>
</head><body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
<div class="page-intro"><div><h1>消息模板</h1><p>新安装默认使用通用服务器文案，不附加项目名称前缀；已有模板保持原样，也可由管理员自行修改。</p></div></div>
<section class="panel"><form id="template-form" class="template-form">
<div class="template-switches"><label><span><strong>玩家进服／退服通知</strong><small>独立于普通 MC 聊天转发</small></span><input type="checkbox" name="presenceNotifyEnabled"></label><label><span><strong>服务器开启／关闭通知</strong><small>正常关服立即上报，异常中断由心跳判断</small></span><input type="checkbox" name="serverStatusNotifyEnabled"></label></div>
<div class="template-grid">
<label>QQ → MC 普通聊天<input name="qqToMcTemplate" required><small>变量：${groupName} ${userName} ${message} ${groupId} ${qq} ${qqOrEmpty}</small></label>
<label>MC → QQ 普通聊天<input name="mcToQqTemplate" required><small>必须包含 ${player} ${message}；可用 ${qq} ${qqOrEmpty}</small></label>
<label>玩家进服<input name="presenceJoinTemplate" required><small>必须包含 ${player}；可用 ${online}</small></label>
<label>玩家退服<input name="presenceQuitTemplate" required><small>必须包含 ${player}；可用 ${online}</small></label>
<label>服务器开启<input name="serverOnlineTemplate" required><small>可用 ${time}</small></label>
<label>服务器关闭<input name="serverOfflineTemplate" required><small>可用 ${time}</small></label>
</div><div class="form-footer"><span class="hint">模板只能是一行，最多 300 字。</span><button class="primary" type="submit">保存模板</button></div>
</form><p id="template-message" class="message" role="status"></p></section>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
