<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
  <title>QQ 登记 · MC × QQ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/registrations.css"><script type="module" src="/registrations.js"></script>
</head>
<body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
  <div class="page-intro"><div><h1>QQ 号与 OpenID</h1><p>新建、查看、修改或删除 QQ 登记。MC 玩家绑定请到绑定管理页操作。</p></div><button id="refresh" class="secondary" type="button">刷新列表</button></div>
  <details class="panel registration-tools">
    <summary>新建登记与联动设置</summary>
    <form id="create-registration" class="registration-create"><label>QQ 号<input id="create-qq" inputmode="numeric" autocomplete="off" required placeholder="5–20 位数字"></label><label>OpenID<input id="create-openid" autocomplete="off" required placeholder="输入 OpenID"></label><label>登记群 OpenID（可选）<input id="create-group" autocomplete="off" placeholder="可留空"></label><button class="secondary" type="submit">新建登记</button></form>
    <div class="registration-switch"><label><input id="unlink-on-delete" type="checkbox"> 删除 QQ 登记时，同时解绑 AQQBot 中该 QQ 名下全部 MC 玩家</label><small>默认关闭。开启后，需输入 QQ 号二次确认；若解绑未全部确认，登记会保留。</small></div>
  </details>
  <section class="panel">
    <label class="registration-search">搜索 QQ 号或 OpenID<input id="search" type="search" autocomplete="off" placeholder="输入 QQ 号或 OpenID"></label>
    <p id="registration-message" class="message" role="status"></p>
    <p id="registration-count" class="registration-count"></p>
    <div class="registration-scroll table-frame" role="region" aria-label="QQ 登记" tabindex="0"><table class="registration-table data-table responsive-table" role="table"><thead><tr><th scope="col">QQ 号</th><th scope="col">OpenID</th><th scope="col">登记群 OpenID</th><th scope="col">登记时间</th><th scope="col">操作</th></tr></thead><tbody id="registration-rows"></tbody></table></div>
  </section>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
