<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
<title>服务器日志 · MC × QQ</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/server-logs.css"><script type="module" src="/server-logs.js"></script>
</head><body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1">
<div class="page-intro"><div><h1>服务器日志</h1><p>显示新版插件从 logs/latest.log 增量同步的最近 2000 行。此页面不能执行命令或修改日志。</p></div><button id="refresh-server-logs" class="secondary" type="button">刷新</button></div>
<section class="panel">
<div class="server-log-controls"><label class="log-switch"><span><strong>同步服务器日志</strong><small>关闭后插件停止读取和上传新日志</small></span><input id="server-log-enabled" type="checkbox"></label><label>搜索日志<input id="server-log-search" type="search" autocomplete="off" placeholder="输入关键字"></label><label class="check"><input id="pause-server-logs" type="checkbox">暂停自动刷新</label><label class="check"><input id="follow-server-logs" type="checkbox" checked>自动滚到底部</label></div>
<p id="server-log-message" class="message" role="status"></p><p id="server-log-count" class="server-log-count"></p>
<pre id="server-log-output" class="server-log-output log-surface" tabindex="0">等待日志…</pre>
</section>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
