<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
  <title>总览 · MC × QQ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/pages.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="bridge-ui auth-page">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航" hidden></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag" hidden></span>
          <button id="logout" class="ghost" type="button" hidden>退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航" hidden></nav>
    <main id="workspace" class="workspace" tabindex="-1">

    <p id="loading-view" role="status" class="hint">正在读取账户状态…</p>
    <section id="setup-view" class="login-card" hidden>
      <h1>设置管理员账户</h1><p>先设置登录这个后台的用户名和密码。</p>
      <form id="setup-form"><label for="setup-username">用户名</label><input id="setup-username" name="username" autocomplete="username" required minlength="3" maxlength="32"><label for="setup-password">密码（至少 6 位，包含字母和数字）</label><input id="setup-password" name="password" type="password" autocomplete="new-password" required minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,256}" title="至少 6 位，只能使用字母和数字，且必须同时包含两者"><label for="setup-confirm">再输入一次密码</label><input id="setup-confirm" type="password" autocomplete="new-password" required minlength="6"><button type="submit" class="primary">创建账户</button></form>
      <p id="setup-message" class="message" role="status"></p>
    </section>

    <section id="login-view" class="login-card" hidden>
      <h1>管理员登录</h1><p>登录后查看连接情况，也可以修改信息。</p>
      <form id="login-form"><label for="username">用户名</label><input id="username" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" class="primary">登录</button></form>
      <p id="login-message" class="message" role="status"></p>
      <a class="help-link" href="/guide">第一次使用？先看教程</a>
    </section>

      <div id="dashboard" hidden>
        <header class="page-intro">
          <div><h1>运行总览</h1><p>QQ 与 Minecraft 桥接状态</p></div>
          <div class="dashboard-actions">
            <time id="dashboard-updated" hidden></time>
            <button id="refresh" class="secondary" type="button"><span aria-hidden="true">↻</span> 刷新状态</button>
          </div>
        </header>
        <p id="dashboard-message" class="message dashboard-status" role="status"></p>
        <section id="dashboard-next" class="panel next-card" hidden>
          <div><h2 id="next-title"></h2><p id="next-description"></p></div>
          <a id="next-link" class="secondary link-button" href="/settings">打开连接设置</a>
        </section>
        <div class="status-grid" aria-label="运行数据">
          <article class="status-card"><span>QQ 登记</span><strong id="registered-count">—</strong><small>当前登记关系</small></article>
          <article class="status-card" id="plugin-card"><span>Bukkit 插件</span><strong id="plugin-indicator">—</strong><small id="plugin-detail">等待状态</small></article>
          <article class="status-card" id="relay-card"><span>聊天转发</span><strong id="relay-indicator">—</strong><small id="relay-detail">等待状态</small></article>
        </div>
        <div class="dashboard-grid">
          <section class="panel activity-panel" aria-labelledby="audit-title">
            <header class="panel-head"><h2 id="audit-title">最近活动</h2><a class="text-link" href="/player-logs">玩家命令日志 <span aria-hidden="true">›</span></a></header>
            <div id="audit" class="records empty" role="region" aria-label="最近活动记录" tabindex="0">正在读取…</div>
          </section>
          <section class="panel connections-panel" aria-labelledby="connection-status-title">
            <header class="panel-head"><h2 id="connection-status-title">连接状态</h2><a class="text-link" href="/settings">连接设置 <span aria-hidden="true">›</span></a></header>
            <dl class="connection-list">
              <div><dt>官方 QQ Bot</dt><dd id="bot-status" class="connection-state">—</dd><dd class="connection-detail" id="bot-detail">—</dd></div>
              <div><dt>Minecraft RCON</dt><dd id="rcon-status" class="connection-state">—</dd><dd class="connection-detail">绑定查询及远程终端</dd></div>
              <div><dt>Bukkit 聊天插件</dt><dd id="plugin-status" class="connection-state">—</dd><dd class="connection-detail" id="plugin-version">—</dd></div>
              <div><dt>OneBot 监听</dt><dd id="onebot-status" class="connection-state">—</dd><dd class="connection-detail">QQ 号和群名称识别</dd></div>
            </dl>
          </section>
        </div>
      </div>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
