# 此插件只转发聊天，不修改 AQQBot 白名单或服务器设置。
# 如果网页程序与 MC 在同一台机器，保持默认地址。
bridge-url: 'http://127.0.0.1:2556/api/plugin/exchange'
# 与网页“修改信息”中的插件 Key 完全相同；至少 32 位。
key: ''

# 只读整库页的数据源；相对于本插件目录，默认指向 plugins/AQQBot/data.yml。
aqqbot-data-path: '../AQQBot/data.yml'

# 服务器整体日志只读数据源；相对于本插件目录，默认指向服务端 logs/latest.log。
server-log-path: '../../logs/latest.log'
