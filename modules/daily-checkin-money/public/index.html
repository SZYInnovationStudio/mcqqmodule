<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日签到 · MC × QQ</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body><main class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">M<span>×</span>Q</span><div><strong>每日签到</strong><small>增量模块</small></div></div><nav class="nav"><a href="/">总览</a><a href="/modules">增量模块</a></nav><div class="top-actions"><span id="current-user" class="local-tag"></span></div></header><div class="page-intro"><div><div class="eyebrow" id="module-version">加载中</div><h1>每日签到设置</h1><p>QQ 群使用 /qd 或 /签到。多个玩家可直接发送 /qd add 玩家名，无需先查询；每天每个 QQ 只能领取一次，北京时间零点重置。</p></div></div><div class="checkin-layout"><section class="panel"><h2>功能与奖励</h2><label class="checkin-toggle">启用每日签到 <input id="enabled" type="checkbox"></label><form id="settings-form" class="checkin-form"><label>最低奖励<input name="min" type="number" min="1" max="1000000" required></label><label>最高奖励<input name="max" type="number" min="1" max="1000000" required></label><label>经济插件 RCON 命令模板<input name="commandTemplate" maxlength="150" required spellcheck="false"></label><p class="hint">必须包含 ${player} 和 ${amount}。不同经济插件的命令可能不同，请先确认安装的插件支持该命令。</p><pre id="preview" class="checkin-preview"></pre><div class="checkin-actions"><button class="primary" type="submit">保存设置</button><button class="secondary" id="test-command" type="button">测试命令（不发钱）</button></div></form><p id="message" class="message" role="status"></p></section><section class="panel"><h2>签到记录</h2><div class="checkin-stats"><div><small>今日人数</small><strong id="count">—</strong></div><div><small>今日发放</small><strong id="amount">—</strong></div></div><button class="secondary" id="refresh" type="button">刷新记录</button><div class="checkin-table-wrap"><table><thead><tr><th>时间</th><th>QQ / OpenID</th><th>玩家</th><th>金额</th><th>状态</th></tr></thead><tbody id="records"></tbody></table></div></section></div></main></body></html>
