<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ede7">
  <script src="/shell.js"></script>
  <title>每日签到 · MC × QQ</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body class="bridge-ui">
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="MC × QQ 总览">
        <span class="brand-mark" aria-hidden="true">M<span>×</span>Q</span>
        <span><strong>MC × QQ</strong><small>桥接管理后台</small></span>
      </a>
      <nav id="main-nav" class="nav" aria-label="主导航"></nav>
      <div class="top-actions">
        <button class="secondary theme-toggle" data-theme-toggle type="button" aria-label="切换深浅色">
          <span class="theme-mark" aria-hidden="true"></span><span data-theme-label>深色</span>
        </button>
        <div class="account-actions">
          <span id="current-user" class="local-tag"></span>
          <button id="logout" class="ghost" type="button">退出</button>
        </div>
      </div>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动导航"></nav>
    <main id="workspace" class="workspace" tabindex="-1"><div class="page-intro"><div><div class="eyebrow" id="module-version">加载中</div><h1>每日签到设置</h1><p>QQ 群使用 /qd 或 /签到。多个玩家可直接发送 /qd add 玩家名，无需先查询；每天每个 QQ 只能领取一次，北京时间零点重置。</p></div></div><div class="checkin-layout"><section class="panel"><h2>功能与奖励</h2><label class="checkin-toggle">启用每日签到 <input id="enabled" type="checkbox"></label><form id="settings-form" class="checkin-form"><label>最低奖励<input name="min" type="number" min="1" max="1000000" required></label><label>最高奖励<input name="max" type="number" min="1" max="1000000" required></label><label>经济插件 RCON 命令模板<input name="commandTemplate" maxlength="150" required spellcheck="false"></label><p class="hint">必须包含 ${player} 和 ${amount}。不同经济插件的命令可能不同，请先确认安装的插件支持该命令。</p><pre id="preview" class="checkin-preview result"></pre><div class="checkin-actions"><button class="primary" type="submit">保存设置</button><button class="secondary" id="test-command" type="button">测试命令（不发钱）</button></div></form><p id="message" class="message" role="status"></p></section><section class="panel"><h2>签到记录</h2><div class="checkin-stats"><div><small>今日人数</small><strong id="count">—</strong></div><div><small>今日发放</small><strong id="amount">—</strong></div></div><button class="secondary" id="refresh" type="button">刷新记录</button><div class="checkin-table-wrap table-frame" role="region" aria-label="签到记录" tabindex="0"><table class="data-table responsive-table" role="table"><thead><tr><th>时间</th><th>QQ / OpenID</th><th>玩家</th><th>金额</th><th>状态</th></tr></thead><tbody id="records"></tbody></table></div></section></div>
    </main>
  </div>
  <dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
    <div class="nav-dialog-head">
      <h2 id="nav-dialog-title">全部页面</h2>
      <form method="dialog"><button class="ghost" type="submit" autofocus>关闭</button></form>
    </div>
    <nav class="nav" aria-label="全部页面"></nav>
  </dialog>
</body>
</html>
